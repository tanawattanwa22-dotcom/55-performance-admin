<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>55 PERFORMANCE | ADMIN</title><meta name="theme-color" content="#101723"><meta name="application-name" content="55 ECU ADMIN"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="55 ECU ADMIN"><link rel="manifest" href="./manifest.webmanifest?v=2"><link rel="icon" type="image/png" sizes="192x192" href="./icons/admin-192.png?v=2"><link rel="apple-touch-icon" sizes="192x192" href="./icons/admin-192.png?v=2"><style>body{background:#101723;color:#f3f6ff;font:16px system-ui;margin:auto;padding:18px;max-width:850px}input,button,select{font:inherit;padding:12px;border-radius:10px;margin:5px;background:#1d2a3d;color:white;border:1px solid #52627a}button{background:#c65e23}section{border:1px solid #384a65;border-radius:16px;padding:16px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;font-size:13px}td{padding:8px;border-bottom:1px solid #344}small{color:#bac5d4}
body{padding:clamp(10px,3vw,22px)}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}
#paging[hidden]{display:none}#license-list{min-width:0}.license-card{margin:12px 0;padding:13px;border:1px solid #3c5068;border-radius:13px;background:#142031}
.license-card header,.license-tools,#paging{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap}
.license-card dl{display:grid;grid-template-columns:minmax(100px,auto) minmax(0,1fr);gap:6px 12px;margin:12px 0}
.license-card dt{color:#bac5d4}.license-card dd{margin:0;overflow-wrap:anywhere}.license-card code{color:#7ce6f5;font-size:15px;overflow-wrap:anywhere;user-select:all}
.license-card button{padding:7px 10px;margin:2px 0;font-size:14px}.license-card input{margin:0;box-sizing:border-box;width:100%;min-width:0}
.license-card form{display:grid;gap:7px;margin-top:9px}.license-card form button{justify-self:start}
.license-card .badge{font-size:13px;border:1px solid #52627a;border-radius:100px;padding:4px 9px;color:#a5e7d4}.license-card .muted{color:#bac5d4}
</style><h1>55 PERFORMANCE • ADMIN</h1><small>จัดการคีย์บน Supabase • ต้องมีสิทธิ์ Admin ที่ตั้งค่าฝั่งเซิร์ฟเวอร์</small><section id="login"><h3>เข้าสู่ระบบแอดมิน</h3><input id="email" type="email" placeholder="อีเมล"><input id="password" type="password" placeholder="รหัสผ่าน"><button id="signin">เข้าสู่ระบบ</button></section><main id="panel" hidden><button id="signout">ออกจากระบบ</button><section><h3>สร้าง License Key</h3><label>อายุคีย์ (วัน) <input id="days" type="number" min="1" max="3650" value="30"></label><label>ราคา (บาท) <input id="price" type="number" min="0" value="500"></label><button id="create">สร้างคีย์ 1 เครื่อง</button><pre id="newkey"></pre><small>คีย์ใหม่จะแสดงในรายการสำหรับแอดมิน และคัดลอกได้ภายหลัง</small></section><section id="license-list"><div class="license-tools"><h3>รายการ License Key</h3><button id="refresh">รีเฟรช</button></div>
<small>แสดงคีย์เต็มและไอดีที่ใช้ล็อกอินของบัญชีที่ผูกกับคีย์ เฉพาะแอดมิน</small>
<div id="list"></div><nav id="paging" aria-label="หน้ารายการคีย์" hidden><button id="prev">ก่อนหน้า</button><small id="page-label"></small><button id="next">ถัดไป</button></nav></section></main><pre id="status"></pre><script src="license-config.js"></script><script src="license-client.js"></script><script>
function msg(x){$('status').textContent=x?.message||String(x)}
const el=(name,text,cls)=>{const n=document.createElement(name);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
const when=new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'});
const date=v=>v?when.format(new Date(v)):'—';
const prices=new Intl.NumberFormat('th-TH',{maximumFractionDigits:2});
let page=0, refreshing=false;
function action(label, fn){
 const b=el('button',label);b.type='button';
 b.addEventListener('click',async()=>{b.disabled=true;try{await fn()}catch(e){msg(e)}finally{b.disabled=false}});
 return b;
}
function card(v){
 const c=el('article',null,'license-card');
 const head=el('header'),tag=v.status==='revoked'?'ระงับ':v.expires_at&&new Date(v.expires_at)<=new Date()?'หมดอายุ':v.bound_user_id?'เปิดใช้งาน':'ยังไม่ผูก';
 head.append(el('strong','รายการ '+String(v.id).slice(0,8)),el('span',tag,'badge'));c.append(head);
 const info=el('dl');
 const field=(label,value)=>{const d=el('dd');d.append(value);info.append(el('dt',label),d)};
 field('คีย์เต็ม',v.license_key?el('code',v.license_key):el('span','คีย์เก่า • ไม่มีเลขเต็มในระบบ','muted'));
 field('ไอดีลูกค้า',v.customer_login||(!v.bound_user_id?'ยังไม่ผูกบัญชี':v.customer_lookup_failed?'โหลดไอดีไม่สำเร็จ • ลองรีเฟรช':'ไม่พบไอดีล็อกอิน'));
 field('เปิดใช้',date(v.activated_at));field('หมดอายุ',date(v.expires_at));
 field('ราคา',prices.format(Number(v.price_baht)||0)+' บาท');
 c.append(info);
 const controls=el('div',null,'license-tools');
 if(v.license_key)controls.append(action('คัดลอกคีย์',async()=>{await navigator.clipboard.writeText(v.license_key);msg('คัดลอกคีย์แล้ว')}));
 else{
  const details=el('details');details.append(el('summary','มีคีย์ต้นฉบับ? บันทึกกลับ'));
  const form=el('form'),input=el('input'),save=el('button','ตรวจและบันทึกคีย์');
  input.placeholder='55P-…';input.setAttribute('aria-label','คีย์ต้นฉบับ');input.required=true;input.autocomplete='off';input.spellcheck=false;
  save.type='submit';form.append(input,save,el('small','ระบบตรวจว่าคีย์ตรงกับรายการนี้ก่อนบันทึก'));
  form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{await api('admin-archive-key',{id:v.id,key:input.value});input.value='';await refresh();msg('บันทึกคีย์แล้ว')}catch(err){msg(err)}finally{save.disabled=false}};
  details.append(form);controls.append(details);
 }
 controls.append(action(v.status==='revoked'?'เปิดใช้':'ระงับ',async()=>{await api('admin-status',{id:v.id,status:v.status==='revoked'?'active':'revoked'});await refresh()}));
 c.append(controls);return c;
}
async function refresh(wanted=page){
 if(refreshing)return;
 refreshing=true;
 $('refresh').disabled=true;$('prev').disabled=true;$('next').disabled=true;
 try{
  let q=await api('admin-list-details',{page:wanted});
  let pages=Math.max(1,Math.ceil(q.total/q.page_size));
  if(wanted>=pages){wanted=pages-1;q=await api('admin-list-details',{page:wanted});pages=Math.max(1,Math.ceil(q.total/q.page_size))}
  page=wanted;
  $('list').replaceChildren(...(q.licenses.length?q.licenses.map(card):[el('p','ยังไม่มีคีย์')]));
  $('page-label').textContent='หน้า '+(page+1)+' / '+pages+' · '+q.total+' คีย์';
  $('paging').hidden=pages<=1;$('prev').disabled=page<=0;$('next').disabled=page+1>=pages;
 }catch(e){$('list').replaceChildren();$('paging').hidden=true;throw e}
 finally{refreshing=false;$('refresh').disabled=false}
}
$('prev').onclick=()=>refresh(page-1).catch(msg);
$('next').onclick=()=>refresh(page+1).catch(msg);
$('signin').onclick=async()=>{try{$('status').textContent='กำลังเข้าสู่ระบบ...';await login($('email').value,$('password').value);$('status').textContent='';await init()}catch(e){msg(e)}};
$('signout').onclick=logout;
$('create').onclick=async()=>{try{const j=await api('admin-create',{days:Number($('days').value),price_baht:Number($('price').value)});$('newkey').textContent=j.key;await refresh()}catch(e){msg(e)}};
$('refresh').onclick=()=>refresh().catch(msg);
async function init(){
 const session=getSession(),valid=!!session&&Date.now()<session.expires_at;
 if(session&&!valid)sessionStorage.removeItem(storageKey);
 $('login').hidden=valid;$('panel').hidden=true;
 if(valid)try{await refresh();$('panel').hidden=false}catch(e){$('login').hidden=false;msg(e)}
}
init();
</script></html>
