<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>55 PERFORMANCE | ADMIN</title><style>body{background:#101723;color:#f3f6ff;font:16px system-ui;margin:auto;padding:18px;max-width:850px}input,button,select{font:inherit;padding:12px;border-radius:10px;margin:5px;background:#1d2a3d;color:white;border:1px solid #52627a}button{background:#c65e23}section{border:1px solid #384a65;border-radius:16px;padding:16px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;font-size:13px}td{padding:8px;border-bottom:1px solid #344}small{color:#bac5d4}</style><h1>55 PERFORMANCE • ADMIN</h1><small>จัดการคีย์บน Supabase • ต้องมีสิทธิ์ Admin ที่ตั้งค่าฝั่งเซิร์ฟเวอร์</small><section id="login"><h3>เข้าสู่ระบบแอดมิน</h3><input id="email" type="email" placeholder="อีเมล"><input id="password" type="password" placeholder="รหัสผ่าน"><button id="signin">เข้าสู่ระบบ</button></section><main id="panel" hidden><button id="signout">ออกจากระบบ</button><section><h3>สร้าง License Key</h3><label>อายุคีย์ (วัน) <input id="days" type="number" min="1" max="3650" value="30"></label><label>ราคา (บาท) <input id="price" type="number" min="0" value="500"></label><button id="create">สร้างคีย์ 1 เครื่อง</button><pre id="newkey"></pre><small>คีย์แสดงเพียงครั้งเดียว ให้คัดลอกเก็บก่อนปิดหน้า</small></section><section><h3>รายการคีย์</h3><button id="refresh">รีเฟรช</button><div id="list"></div></section></main><pre id="status"></pre><script src="license-config.js"></script><script src="license-client.js"></script><script>
function msg(x){$('status').textContent=x.message||String(x)}
async function refresh(){const j=await api('admin-list');const t=document.createElement('table');for(const v of j.licenses){const tr=t.insertRow();for(const s of [v.id.slice(0,8),v.status,v.expires_at||'ยังไม่เริ่ม',v.bound_user_id?'ผูกแล้ว':'ยังไม่ผูก',String(v.price_baht)]){const td=tr.insertCell();td.textContent=s;}const td=tr.insertCell(),b=document.createElement('button');b.textContent=v.status==='revoked'?'เปิดใช้':'ระงับ';b.onclick=async()=>{try{await api('admin-status',{id:v.id,status:v.status==='revoked'?'active':'revoked'});await refresh()}catch(e){msg(e)}};td.append(b)}$('list').replaceChildren(t)}
$('signin').onclick=async()=>{try{$('status').textContent='กำลังเข้าสู่ระบบ...';await login($('email').value,$('password').value);await init();$('status').textContent=''}catch(e){msg(e)}};
$('signout').onclick=logout;
$('create').onclick=async()=>{try{const j=await api('admin-create',{days:Number($('days').value),price_baht:Number($('price').value)});$('newkey').textContent=j.key;await refresh()}catch(e){msg(e)}};
$('refresh').onclick=()=>refresh().catch(msg);
async function init(){const session=getSession();$('login').hidden=!!session;$('panel').hidden=!session;if(session)try{await refresh()}catch(e){msg(e)}}init();
</script></html>
