<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#081725">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://awkxbvjcxtssexecstke.supabase.co; base-uri 'none'; form-action 'none'">
<title>55 PERFORMANCE — ยืนยันบัญชี / เปลี่ยนรหัสผ่าน</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:18px;display:grid;place-items:center;background:radial-gradient(ellipse at 10% 10%,#19344b,#07131f 55%);color:#eaf8ff;font:16px/1.5 system-ui,-apple-system,"Noto Sans Thai",sans-serif}
main{max-width:450px;width:100%;padding:25px 22px;background:#12283a;border:1px solid #4e879f;border-radius:17px;box-shadow:0 18px 70px #0007}
.brand{font-weight:800;font-size:12px;letter-spacing:1.5px;color:#6fe7f5}
h1{font-size:24px;line-height:1.25;margin:9px 0 12px}
p{font-size:14px;color:#c6dce7;line-height:1.65}
label{display:block;margin:17px 0 6px;font-weight:600;font-size:14px}
input{width:100%;padding:13px;background:#0a1b2b;border:1px solid #6491a8;border-radius:9px;color:#fff;font:inherit;min-width:0}
button{width:100%;margin-top:19px;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:800;background:#f18c43;color:#101820}
button:disabled{opacity:.55}
#form{display:none}
#status{font-size:14px;color:#ffe7a4;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:15px}
small{display:block;color:#91b9ca;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="brand">55 PERFORMANCE • SECURE ACCOUNT</div>
<h1 id="heading">กำลังตรวจสอบลิงก์...</h1>
<p id="intro">กรุณาตรวจสอบอีเมลและเปิดลิงก์ล่าสุดเพียงครั้งเดียว</p>
<form id="form" autocomplete="off">
<label for="password">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label>
<input id="password" type="password" required minlength="8" autocomplete="new-password">
<label for="repeat">ยืนยันรหัสผ่านใหม่</label>
<input id="repeat" type="password" required minlength="8" autocomplete="new-password">
<button id="save" type="submit">บันทึกรหัสผ่านใหม่</button>
</form>
<div id="status" role="status" aria-live="polite"></div>
<small>บัญชีและ License Key เดิมไม่ถูกลบหรือย้ายสิทธิ์</small>
</main>
<script>
(()=>{"use strict";
const root="https://awkxbvjcxtssexecstke.supabase.co",
apiKey="sb_publishable_bAHn9Cks9TVLgGAUlh-_GA_JF9hOqtf";
const hash=new URLSearchParams(location.hash.substring(1));
const query=new URLSearchParams(location.search);
const type=hash.get("type")||query.get("type");
let accessToken=hash.get("access_token")||"";
const error=hash.get("error")||query.get("error");
const $=id=>document.getElementById(id);
try{history.replaceState(null,"",location.pathname);}catch{}
const set=(heading,intro,status="")=>{$("heading").textContent=heading;$("intro").textContent=intro;$("status").textContent=status;};
if(error){
 set("ลิงก์ไม่สามารถใช้งานได้","ลิงก์อาจหมดอายุหรือถูกใช้แล้ว กรุณากลับไปที่ 55 PERFORMANCE และขออีเมลฉบับใหม่");
 return;
}
if(type==="recovery" && accessToken){
 set("ตั้งรหัสผ่านใหม่","กรอกรหัสผ่านใหม่ทั้งสองช่อง แล้วกดบันทึก จากนั้นกลับไปเข้าสู่ระบบในแอป");
 $("form").style.display="block";
}else if(accessToken && ["signup","email","invite","magiclink"].includes(type)){
 accessToken="";
 set("ยืนยันอีเมลสำเร็จ","กลับไปเปิดแอป 55 PERFORMANCE ใช้อีเมลและรหัสผ่านที่ตั้งตอนสมัครเข้าสู่ระบบ แล้วจึงกรอก License Key");
 return;
}else{
 accessToken="";
 set("ไม่พบลิงก์ที่ใช้งานได้","หากยืนยันอีเมลไปแล้ว ให้กลับไปเข้าสู่ระบบในแอป หากลืมรหัสผ่าน ให้ขอลิงก์กู้คืนฉบับใหม่จากแอป");
 return;
}
$("form").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!$("form").reportValidity()||$("save").disabled)return;
 const password=$("password").value;
 if(password!==$("repeat").value){$("status").textContent="รหัสผ่านสองช่องไม่ตรงกัน";return;}
 if(password.length<8){$("status").textContent="รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร";return;}
 $("save").disabled=true;$("status").textContent="กำลังบันทึกรหัสผ่านใหม่...";
 try{
  const res=await fetch(root+"/auth/v1/user",{
   method:"PUT",cache:"no-store",mode:"cors",
   headers:{"apikey":apiKey,"Authorization":"Bearer "+accessToken,"Content-Type":"application/json"},
   body:JSON.stringify({password})
  });
  if(!res.ok)throw new Error("Could not update password");
  $("password").value="";$("repeat").value="";
  $("form").style.display="none";accessToken="";
  set("เปลี่ยนรหัสผ่านสำเร็จ","เปิดแอป 55 PERFORMANCE แล้วเข้าสู่ระบบด้วยรหัสผ่านใหม่ หลังล็อกอินสำเร็จจึงกรอก License Key เดิม","คุณสามารถปิดหน้านี้ได้");
 }catch(_){
  $("status").textContent="ตั้งรหัสผ่านไม่สำเร็จ ลิงก์อาจหมดอายุหรือถูกใช้แล้ว กรุณาขออีเมลกู้คืนฉบับใหม่";
 }finally{$("save").disabled=false;}
});
})();
</script>
</body>
</html>
